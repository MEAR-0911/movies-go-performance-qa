
name: Prepare Movies Go QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare QA environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v7
        with:
          path: qa

      - name: Checkout original Movies Go
        uses: actions/checkout@v7
        with:
          repository: AsaelCRdev/Proyecto-equipo-64-1
          ref: main
          path: movies-go
          persist-credentials: false

      - name: Verify expected project files
        shell: bash
        run: |
          set -e

          test -f movies-go/README.md
          test -f movies-go/Front/package.json
          test -f movies-go/Back/pom.xml

          echo "README found"
          echo "Angular package.json found"
          echo "Backend Maven pom.xml found"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify toolchain
        run: |
          java --version
          node --version
          npm --version
