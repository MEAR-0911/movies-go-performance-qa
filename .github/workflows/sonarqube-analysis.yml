
name: SonarQube Movies Go Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Build and analyze Movies Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v7
        with:
          path: qa

      - name: Checkout original Movies Go
        uses: actions/checkout@v7
        with:
          repository: AsaelCRdev/Proyecto-equipo-64-1
          ref: main
          path: movies-go
          fetch-depth: 0
          persist-credentials: false

      - name: Verify expected project files
        shell: bash
        run: |
          set -e

          test -f movies-go/README.md
          test -f movies-go/Back/pom.xml
          test -f movies-go/Front/package.json
          test -f movies-go/Front/package-lock.json
          test -f movies-go/Front/angular.json

          test -d movies-go/Back/src/main/java
          test -d movies-go/Back/src/test/java
          test -d movies-go/Front/src

          echo "Movies Go structure verified."

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: movies-go/Back/pom.xml

      - name: Build backend
        run: mvn -B -f movies-go/Back/pom.xml -DskipTests package

      - name: Verify compiled Java classes
        shell: bash
        run: |
          set -e

          test -d movies-go/Back/target/classes
          test -d movies-go/Back/target/test-classes

          echo "Backend compiled classes found."
      
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with:
          projectBaseDir: movies-go
          args: >
            -Dsonar.organization=mear-0911
            -Dsonar.projectKey=MEAR-0911_movies-go-performance-qa
            -Dsonar.sources=Back/src/main/java,Front/src
            -Dsonar.tests=Back/src/test/java
            -Dsonar.java.binaries=Back/target/classes
            -Dsonar.java.test.binaries=Back/target/test-classes
            -Dsonar.sourceEncoding=UTF-8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
