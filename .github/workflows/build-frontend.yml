
name: Build Movies Go Frontend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Angular frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original Movies Go
        uses: actions/checkout@v7
        with:
          repository: AsaelCRdev/Proyecto-equipo-64-1
          ref: main
          path: movies-go
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: movies-go/Front/package-lock.json

      - name: Install frontend dependencies
        working-directory: movies-go/Front
        run: npm ci

      - name: Build Angular frontend
        working-directory: movies-go/Front
        run: npm run build
