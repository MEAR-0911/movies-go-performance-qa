
name: Start Movies Go Backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Start backend and check HTTP response
    runs-on: ubuntu-latest

    steps:
      - name: Checkout original Movies Go
        uses: actions/checkout@v7
        with:
          repository: AsaelCRdev/Proyecto-equipo-64-1
          ref: main
          path: movies-go
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: movies-go/Back/pom.xml

      - name: Start Spring Boot
        working-directory: movies-go/Back
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        shell: bash
        run: |
          if [ -z "$OMDB_KEY" ]; then
            echo "Missing GitHub Actions secret: OMDB_KEY"
            exit 1
          fi

          mvn -B spring-boot:run > "$RUNNER_TEMP/moviesgo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/moviesgo.pid"

      - name: Check backend response
        shell: bash
        run: |
          set -e

          for attempt in {1..30}; do
            if ! kill -0 "$(cat "$RUNNER_TEMP/moviesgo.pid")" 2>/dev/null; then
              echo "Backend process stopped unexpectedly."
              cat "$RUNNER_TEMP/moviesgo.log"
              exit 1
            fi

            if curl --silent --show-error --fail \
              http://127.0.0.1:8080/getGenres \
              --output "$RUNNER_TEMP/genres-response.json"; then
              echo "Backend responded successfully."
              cat "$RUNNER_TEMP/genres-response.json"
              exit 0
            fi

            sleep 2
          done

          echo "Backend did not respond within the allotted time."
          cat "$RUNNER_TEMP/moviesgo.log"
          exit 1

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/moviesgo.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/moviesgo.pid")" 2>/dev/null || true
          fi
